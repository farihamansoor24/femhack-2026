<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind (CDN, config extended in a script tag below) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#1B2430',
          ink2: '#232E3D',
          paper: '#F5F1E6',
          paper2: '#EDE7D6',
          brass: '#C08A28',
          brasslight: '#E4B75E',
          rust: '#B14A2E',
          forest: '#2F6F4E',
          slate2: '#4B5563',
        },
        fontFamily: {
          display: ['Fraunces', 'serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        },
      },
    },
  };
</script>
<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="bg-paper text-ink font-body antialiased">
   
 <section class="max-w-md mx-auto px-5 py-16 sm:py-24">
      <div class="ticket pl-9 pr-6 sm:pr-8 py-9">
        <div class="ticket-notch"></div>
        <p class="eyebrow mb-2">Join the guild</p>
        <h1 class="font-display text-2xl mb-6">Create your account</h1>

        <div class="grid grid-cols-2 gap-3 mb-6" role="radiogroup" aria-label="Account type">
          <button type="button" data-role="customer" class="role-btn chip active !py-3 !px-3 text-center">I need a service</button>
          <button type="button" data-role="provider" class="role-btn chip !py-3 !px-3 text-center">I provide a service</button>
        </div>

        <form id="register-form" novalidate class="space-y-4">
          <div>
            <label class="text-sm font-medium block mb-1.5" for="name">Full name</label>
            <input id="name" name="name" type="text" required
              class="w-full px-4 py-3 border border-ink/10 rounded-sm text-sm focus:border-brass outline-none" />
          </div>
          <div>
            <label class="text-sm font-medium block mb-1.5" for="email">Email</label>
            <input id="email" name="email" type="email" required
              class="w-full px-4 py-3 border border-ink/10 rounded-sm text-sm focus:border-brass outline-none" />
          </div>
          <div>
            <label class="text-sm font-medium block mb-1.5" for="password">Password</label>
            <input id="password" name="password" type="password" minlength="6" required
              class="w-full px-4 py-3 border border-ink/10 rounded-sm text-sm focus:border-brass outline-none" />
            <p class="text-xs text-slate2 mt-1">At least 6 characters.</p>
          </div>
          <button type="submit" id="submit-btn" class="w-full bg-ink text-paper font-semibold py-3.5 rounded-sm hover:bg-ink2 transition-colors">
            Create account
          </button>
            <!-- Google Auth Button -->
            <button type="button" id="googleAuthBtn" class="w-full flex items-center justify-center gap-3 py-3.5 px-4 bg-white border border-slate-200 rounded-2xl text-xs font-bold uppercase tracking-widest text-slate-700 hover:bg-slate-50 hover:border-slate-300 transition-all duration-300 shadow-sm active:scale-[0.99]">
              <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>Continue with Google</span>
            </button>
        </form>

        <p class="text-sm text-slate2 mt-6 text-center">
          Already have an account? <a href="login.html" data-link class="text-brass font-semibold">Log in</a>
        </p>
      </div>
    </section>
      <!-- ===== Toast ===== -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden">
    <div id="toast-body" class="bg-ink text-paper text-sm font-medium px-5 py-3 rounded-sm shadow-xl border border-brass/40"></div>
  </div>
  <script>



</script>
<script type="module" src="./js/main.js"></script>
<script type="module" src="./js/ui/register.js"></script>

</body>
</html>
