<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind (CDN, config extended in a script tag below) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#1B2430',
          ink2: '#232E3D',
          paper: '#F5F1E6',
          paper2: '#EDE7D6',
          brass: '#C08A28',
          brasslight: '#E4B75E',
          rust: '#B14A2E',
          forest: '#2F6F4E',
          slate2: '#4B5563',
        },
        fontFamily: {
          display: ['Fraunces', 'serif'],
          body: ['Inter', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        },
      },
    },
  };
</script>
<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="bg-paper text-ink font-body antialiased">
   
    <section class="max-w-md mx-auto px-5 py-16 sm:py-24">
      <div class="ticket pl-9 pr-6 sm:pr-8 py-9">
        <div class="ticket-notch"></div>
        <p class="eyebrow mb-2">Welcome back</p>
        <h1 class="font-display text-2xl mb-6">Log in to Guildwork</h1>

        <form id="login-form" novalidate class="space-y-4">
          <div>
            <label class="text-sm font-medium block mb-1.5" for="email">Email</label>
            <input id="email" name="email" type="email" required
              class="w-full px-4 py-3 border border-ink/10 rounded-sm text-sm focus:border-brass outline-none" />
          </div>
          <div>
            <label class="text-sm font-medium block mb-1.5" for="password">Password</label>
            <input id="password" name="password" type="password" required
              class="w-full px-4 py-3 border border-ink/10 rounded-sm text-sm focus:border-brass outline-none" />
          </div>
          <button type="submit" id="submit-btn" class="w-full bg-ink text-paper font-semibold py-3.5 rounded-sm hover:bg-ink2 transition-colors">
            Log in
          </button>
        </form>

        <p class="text-sm text-slate2 mt-6 text-center">
          New here? <a href="register.html" data-link class="text-brass font-semibold">Create an account</a>
        </p>
      </div>
    </section>
      <!-- ===== Toast ===== -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden">
    <div id="toast-body" class="bg-ink text-paper text-sm font-medium px-5 py-3 rounded-sm shadow-xl border border-brass/40"></div>
  </div>

<script type="module" src="./js/main.js"></script>
<script type="module" src="./js/ui/login.js"></script>

</body>
</html>
